[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_USE_MOCKS = "true"
  VITE_DEFAULT_RESTAURANT_ID = "rest_lumiere"
  VITE_DEFAULT_RESTAURANT_SLUG = "lumiere-mayfair"

# SPA fallback so /menu, /reservations, /admin, and other client routes
# serve index.html instead of Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
